# /etc/ssh/sshd_config.d/10-remote-access.conf — phone access over Tailscale only (installed by ~/.config/remote/install.sh)
# First match wins in sshd, so this file (10-) overrides Fedora's 50-redhat.conf.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers levi
# No forwarding of any kind: in particular no agent forwarding, so nothing on this laptop (Claude included)
# can ever use the phone's keys — that's what keeps the remote-wipe signing key out of reach.
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 60
ClientAliveCountMax 5
